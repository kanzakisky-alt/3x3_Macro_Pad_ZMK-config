# Turn on the display framework
CONFIG_ZMK_DISPLAY=y

# Force the battery status to update and report data continuously
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable the Layer status text display
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Power Management Optimization (Saves battery when sleeping)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
